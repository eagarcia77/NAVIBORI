name: Refresh npm lockfile

on:
  push:
    branches:
      - foundation/navibori-v0.1
    paths:
      - package.json
      - .github/workflows/lockfile.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: foundation/navibori-v0.1
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate package-lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit package-lock
        run: |
          if [ -z "$(git status --porcelain -- package-lock.json)" ]; then
            echo "package-lock.json is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh npm lockfile"
          git push
