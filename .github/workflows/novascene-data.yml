name: Generate NovaScene local 3D data

on:
  push:
    branches:
      - feature/novascene-local-3d-snapshot-20261013
    paths:
      - scripts/build_novascene_snapshot.py
      - .github/workflows/novascene-data.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Checkout branch with write credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official Overture tooling
        run: python -m pip install --disable-pip-version-check overturemaps
      - name: Download ODbL licensed real buildings in central Juana Diaz
        run: |
          overturemaps download --bbox=-66.531,18.037,-66.486,18.068 \
            --type=building -f geojson -o /tmp/novascene-buildings.geojson
          test -s /tmp/novascene-buildings.geojson
      - name: Build static local GeoJSON with honest estimated heights
        run: |
          python scripts/build_novascene_snapshot.py \
            --input /tmp/novascene-buildings.geojson \
            --output public/data/novascene/juana-diaz.geojson
          python -c 'import json; x=json.load(open("public/data/novascene/juana-diaz.geojson")); assert len(x["features"]) > 100, "Insufficient real building coverage"; print(len(x["features"]))'
      - name: Commit generated spatial data to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/novascene/juana-diaz.geojson
          if ! git diff --cached --quiet; then
            git commit -m "data(novascene): add verified local Overture building footprints"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
