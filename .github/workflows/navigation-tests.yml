name: Navigation module tests
on:
  push:
    paths:
      - "navigation/**"
      - ".github/workflows/navigation-tests.yml"
  pull_request:
    paths:
      - "navigation/**"
      - ".github/workflows/navigation-tests.yml"
  workflow_dispatch:
jobs:
  navigation-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: navigation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run navigation tests
        run: npm test
